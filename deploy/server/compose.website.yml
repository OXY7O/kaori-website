name: kaori-website

services:
  web:
    image: ${KAORI_WEBSITE_IMAGE:?KAORI_WEBSITE_IMAGE must be an immutable digest reference}
    restart: unless-stopped
    init: true
    # Enforce NGINX's unprivileged runtime identity even if the image defaults drift.
    user: "101:101"
    read_only: true
    # Static port 8080 requires no ambient Linux capabilities.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Versioned public release status is controlled by the host receipt, never by the signed image.
    # Per-deployment adapter overrides this path for the isolated UAT project.
    volumes:
      - ${KAORI_WEBSITE_RELEASE_METADATA_DIR:-/var/lib/kaori-website/deploy-state/release-metadata}:/usr/share/nginx/html/.well-known/kaori-website:ro
      - ${KAORI_WEBSITE_ANALYTICS_DIR:-/var/lib/kaori-website/deploy-state/analytics-public}:/usr/share/nginx/html/.well-known/kaori-analytics:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    expose:
      - "8080"
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/healthz
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - website-internal

networks:
  website-internal:
    internal: true
