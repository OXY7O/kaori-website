name: Emit canonical homepage format (temporary)
on:
  push:
    branches: [kaori/task-4-governed-ci-pipeline]
    paths: [.github/workflows/emit-home-format.yml]
permissions:
  contents: read
jobs:
  format:
    runs-on: [self-hosted, linux, x64, platform-ci]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Emit Prettier output without mutating repository
        run: |
          set -Eeuo pipefail
          printf 'KAORI_HOMEPAGE_FORMAT_BEGIN\n'
          ./node_modules/.bin/prettier src/pages/index.astro | base64 -w0
          printf '\nKAORI_HOMEPAGE_FORMAT_END\n'
