name: KAORI Website UAT Port Diagnosis
on:
  push:
    branches: [kaori/staging]
    paths:
      - .github/workflows/uat-port-diagnostic.yml
permissions:
  contents: read
concurrency:
  group: kaori-website-uat-port-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    name: Read-only UAT Host Port Diagnosis
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 15
    env:
      WEBSITE_HOST: ${{ vars.KAORI_WEBSITE_HOST }}
      WEBSITE_SSH_PORT: ${{ vars.KAORI_WEBSITE_HOST_PORT }}
      WEBSITE_SSH_USER: ${{ vars.KAORI_WEBSITE_HOST_USER }}
      WEBSITE_SSH_KEY: ${{ secrets.KAORI_WEBSITE_HOST_SSH_PRIVATE_KEY }}
      WEBSITE_SSH_PASSPHRASE: ${{ secrets.KAORI_WEBSITE_HOST_SSH_PASSPHRASE }}
      WEBSITE_KNOWN_HOSTS: ${{ secrets.KAORI_WEBSITE_HOST_KNOWN_HOSTS }}
    steps:
      - name: Checkout exact admitted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Diagnose approved UAT host without changes
        shell: bash
        run: bash scripts/uat/diagnose-host-port.sh
