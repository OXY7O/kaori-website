name: Release Deployment
run-name: "Release Deployment · ${{ inputs.candidate_tag || github.ref_name }}"
on:
  push:
    branches:
      - kaori/uat-request
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Exact approved website release candidate (vX.Y.Z-rc.N)
        type: string
        required: true
      approval_reference:
        description: Link to explicit maintainer release deployment authorization
        type: string
        required: true
      publish_existing_edge:
        description: Reattach approved public edge and require live HTTPS health (explicit maintainer authorization)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: kaori-website-release-deploy
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy Release Candidate
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 45
    env:
      ACCEPTED_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      REGISTRY_HOST: ${{ vars.KAORI_WEBSITE_DOCKER_REGISTRY_HOST }}
      REGISTRY_IMAGE: ${{ vars.KAORI_WEBSITE_DOCKER_REGISTRY_IMAGE }}
      REGISTRY_USER: ${{ secrets.KAORI_WEBSITE_DOCKER_REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.KAORI_WEBSITE_DOCKER_REGISTRY_PASSWORD }}
      WEBSITE_HOST: ${{ vars.KAORI_WEBSITE_HOST }}
      WEBSITE_SSH_PORT: ${{ vars.KAORI_WEBSITE_HOST_PORT }}
      WEBSITE_SSH_USER: ${{ vars.KAORI_WEBSITE_HOST_USER }}
      WEBSITE_DEPLOY_ROOT: ${{ vars.KAORI_WEBSITE_HOST_DEPLOY_ROOT }}
      WEBSITE_SSH_KEY: ${{ secrets.KAORI_WEBSITE_HOST_SSH_PRIVATE_KEY }}
      WEBSITE_SSH_PASSPHRASE: ${{ secrets.KAORI_WEBSITE_HOST_SSH_PASSPHRASE }}
      WEBSITE_KNOWN_HOSTS: ${{ secrets.KAORI_WEBSITE_HOST_KNOWN_HOSTS }}
    steps:
      - name: Checkout exact approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve source-pinned UAT request and signed RC
        id: request
        shell: bash
        env:
          REQUEST_TAG: ${{ inputs.candidate_tag }}
          REQUEST_APPROVAL: ${{ inputs.approval_reference }}
          REQUEST_PUBLIC_EDGE: ${{ inputs.publish_existing_edge && '1' || '0' }}
        run: |
          set -Eeuo pipefail
          fail() { printf 'BLOCK: %s\n' "$*" >&2; exit 1; }
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          accepted="$(curl -fsS "${headers[@]}" "$api/git/ref/heads/kaori/staging" | jq -r '.object.sha')"
          [[ "$accepted" =~ ^[a-f0-9]{40}$ && "$GITHUB_SHA" == "$accepted" ]] || fail 'UAT request SHA does not match current admitted staging'
          [[ "$(git rev-parse HEAD)" == "$accepted" ]] || fail 'UAT checkout does not match accepted staging'
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/kaori/staging ]] || fail 'manual UAT must target staging'
            tag="$REQUEST_TAG"
            approval="$REQUEST_APPROVAL"
            edge="$REQUEST_PUBLIC_EDGE"
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF" == refs/heads/kaori/uat-request ]] || fail 'only kaori/uat-request may trigger UAT on push'
            releases="$(curl -fsS "${headers[@]}" "$api/releases?per_page=100")"
            matches="$(jq -c --arg sha "$accepted" '[.[] | select(.prerelease == true and .target_commitish == $sha) | select(.tag_name | test("^v[0-9]+[.][0-9]+[.][0-9]+-rc[.][1-9][0-9]*$"))]' <<<"$releases")"
            [[ "$(jq length <<<"$matches")" == 1 ]] || fail 'exactly one signed RC prerelease must exist for current staging SHA before requesting UAT'
            tag="$(jq -r '.[0].tag_name' <<<"$matches")"
            tag_sha="$(curl -fsS "${headers[@]}" "$api/git/ref/tags/$tag" | jq -r '.object.sha')"
            [[ "$tag_sha" == "$accepted" ]] || fail 'RC tag does not identify accepted staging SHA'
            publisher="$(curl -fsS "${headers[@]}" "$api/actions/workflows/publish-staging-image.yml/runs?per_page=100")"
            jq -e --arg sha "$accepted" '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")] | length > 0' <<<"$publisher" >/dev/null || fail 'successful signed RC publisher run missing for this source'
            pull_requests="$(curl -fsS "${headers[@]}" "$api/commits/$accepted/pulls")"
            number="$(jq -r --arg sha "$accepted" '[.[] | select(.merge_commit_sha == $sha and .base.ref == "kaori/staging" and .merged_at != null)] | first.number // empty' <<<"$pull_requests")"
            [[ "$number" =~ ^[0-9]+$ ]] || fail 'cannot identify merged staging PR that authorizes this UAT request'
            approval="https://github.com/$GITHUB_REPOSITORY/pull/$number"
            edge=0
          else
            fail 'unsupported UAT request event'
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]] || fail 'UAT candidate tag is invalid'
          [[ "$approval" =~ ^https://github.com/OXY7O/kaori-website/(pull|issues)/[0-9]+$ ]] || fail 'explicit merged PR or issue authorization required'
          [[ "$edge" == 0 || "$edge" == 1 ]] || fail 'invalid public edge option'
          printf 'RC_TAG=%s\nAPPROVAL_REF=%s\nKAORI_WEBSITE_ATTACH_EXISTING_EDGE=%s\n' "$tag" "$approval" "$edge" >> "$GITHUB_ENV"
          printf 'PASS: UAT request %s -> %s; edge attachment=%s\n' "$tag" "$accepted" "$edge"
      - name: Verify prerelease, pinned host and explicit approval reference
        shell: bash
        run: bash scripts/release/deploy-release.sh preflight
      - name: Deploy via separate pinned SSH trust boundary
        shell: bash
        run: bash scripts/release/deploy-release.sh deploy
      - name: Record deployment evidence and acceptance boundary
        shell: bash
        run: |
          printf 'Website release deployment requested for %s at source %s\n' "$RC_TAG" "$ACCEPTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'Approval reference: %s\n' "$APPROVAL_REF" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$KAORI_WEBSITE_ATTACH_EXISTING_EDGE" == 1 ]]; then
            printf 'EXISTING PUBLIC EDGE REATTACHMENT / THREE-DOMAIN HTTPS READINESS: PASS\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'ISOLATED PRIVATE DEPLOYMENT ONLY; PUBLIC EDGE / TLS: NOT VERIFIED\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'FULL TLS / HOST-SNI / BROWSER QA / HUMAN ACCEPTANCE: PENDING\n' >> "$GITHUB_STEP_SUMMARY"
