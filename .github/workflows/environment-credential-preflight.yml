# Issue #239: single safe read-only preflight, no runtime mutation.
name: Environment Credential Preflight

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Existing protected GitHub Environment to verify
        required: true
        type: choice
        options:
          - staging
          - production
  push:
    branches:
      - kaori/staging
    paths:
      - .github/workflows/environment-credential-preflight.yml
      - scripts/environment-credential-preflight.sh

permissions:
  contents: read

concurrency:
  group: env-preflight-${{ github.ref }}-${{ inputs.target_environment || 'staging' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Read-only Environment / Registry / SSH
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 12
    environment:
      name: ${{ github.event_name == 'push' && 'staging' || inputs.target_environment }}
    env:
      TARGET_ENV: ${{ inputs.target_environment || 'staging' }}
      REGISTRY_USER: ${{ secrets.KAORI_WEBSITE_DOCKER_REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.KAORI_WEBSITE_DOCKER_REGISTRY_PASSWORD }}
      DEPLOY_SSH_KEY: ${{ secrets.KAORI_WEBSITE_HOST_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_PASSPHRASE: ${{ secrets.KAORI_WEBSITE_HOST_SSH_PASSPHRASE }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.KAORI_WEBSITE_HOST_KNOWN_HOSTS }}
      RECEIPT_PATH: /var/lib/kaori-website/deploy-state/release.env
      HOST_ENV_PATH: ""
    steps:
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve protected Environment configuration
        shell: bash
        env:
          KAORI_WEBSITE_DOCKER_REGISTRY_HOST: ${{ vars.KAORI_WEBSITE_DOCKER_REGISTRY_HOST }}
          KAORI_WEBSITE_DOCKER_REGISTRY_IMAGE: ${{ vars.KAORI_WEBSITE_DOCKER_REGISTRY_IMAGE }}
          KAORI_WEBSITE_HOST: ${{ vars.KAORI_WEBSITE_HOST }}
          KAORI_WEBSITE_HOST_PORT: ${{ vars.KAORI_WEBSITE_HOST_PORT }}
          KAORI_WEBSITE_HOST_USER: ${{ vars.KAORI_WEBSITE_HOST_USER }}
          KAORI_WEBSITE_HOST_DEPLOY_ROOT: ${{ vars.KAORI_WEBSITE_HOST_DEPLOY_ROOT }}
          KAORI_WEBSITE_COMPOSE_PROJECT: ${{ vars.KAORI_WEBSITE_COMPOSE_PROJECT }}
          KAORI_WEBSITE_STATE_DIR: ${{ vars.KAORI_WEBSITE_STATE_DIR }}
          KAORI_WEBSITE_LOOPBACK_PORT: ${{ vars.KAORI_WEBSITE_LOOPBACK_PORT }}
          KAORI_WEBSITE_ATTACH_EXISTING_EDGE: ${{ vars.KAORI_WEBSITE_ATTACH_EXISTING_EDGE }}
        run: bash scripts/release/resolve-environment.sh preflight
      - name: Validate Environment registry, pinned SSH and VM receipt without mutation
        shell: bash
        run: |
          bash -n scripts/environment-credential-preflight.sh
          bash scripts/environment-credential-preflight.sh
