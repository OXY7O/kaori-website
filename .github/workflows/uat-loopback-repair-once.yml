name: KAORI Website One-Time UAT Loopback Repair
on:
  push:
    branches: [kaori/staging]
    paths:
      - .github/workflows/uat-loopback-repair-once.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: kaori-website-uat-loopback-repair-15
  cancel-in-progress: false
jobs:
  admission:
    name: Verify Exact Repair Admission
    if: ${{ contains(github.event.head_commit.message, '[KAORI_UAT_PORT_REPAIR_15]') }}
    runs-on: [self-hosted, linux, x64, platform-ci]
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      ACCEPTED_SHA: ${{ github.sha }}
    steps:
      - name: Verify latest staging SHA and Full Admission
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/kaori/staging ]] || exit 1
          base="https://api.github.com/repos/$GITHUB_REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          for attempt in $(seq 1 65); do
            current="$(curl -fsS "${headers[@]}" "$base/git/ref/heads/kaori/staging" | jq -r .object.sha)"
            [[ "$current" == "$ACCEPTED_SHA" ]] || { echo 'BLOCK: staging moved during repair authorization' >&2; exit 1; }
            payload="$(curl -fsS "${headers[@]}" "$base/actions/workflows/quality.yml/runs?branch=kaori%2Fstaging&event=push&per_page=100")"
            record="$(jq -c --arg sha "$ACCEPTED_SHA" '[.workflow_runs[] | select(.head_sha==$sha)] | sort_by(.run_number) | last // empty' <<< "$payload")"
            if [[ -n "$record" ]]; then
              status="$(jq -r .status <<< "$record")"
              result="$(jq -r .conclusion <<< "$record")"
              if [[ "$status" == completed ]]; then
                [[ "$result" == success ]] || { echo 'BLOCK: full repair admission failed' >&2; exit 1; }
                echo "PASS: exact SHA Full Admission - $(jq -r .html_url <<< "$record")"
                exit 0
              fi
            fi
            sleep 15
          done
          echo 'BLOCK: timeout waiting for exact staging admission' >&2
          exit 1
  repair:
    name: Repair Loopback Access Without Rebuilding
    needs: admission
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ACCEPTED_SHA: ${{ github.sha }}
      RELEASE_TAG: v0.1.0-rc.1
      RELEASE_SOURCE_SHA: 92ebc2d1cddf5c4cdf09c199602372d76350c14f
      REGISTRY_HOST: ${{ vars.KAORI_WEBSITE_DOCKER_REGISTRY_HOST }}
      REGISTRY_IMAGE: ${{ vars.KAORI_WEBSITE_DOCKER_REGISTRY_IMAGE }}
      WEBSITE_HOST: ${{ vars.KAORI_WEBSITE_HOST }}
      WEBSITE_SSH_PORT: ${{ vars.KAORI_WEBSITE_HOST_PORT }}
      WEBSITE_SSH_USER: ${{ vars.KAORI_WEBSITE_HOST_USER }}
      WEBSITE_SSH_KEY: ${{ secrets.KAORI_WEBSITE_HOST_SSH_PRIVATE_KEY }}
      WEBSITE_SSH_PASSPHRASE: ${{ secrets.KAORI_WEBSITE_HOST_SSH_PASSPHRASE }}
      WEBSITE_KNOWN_HOSTS: ${{ secrets.KAORI_WEBSITE_HOST_KNOWN_HOSTS }}
    steps:
      - name: Checkout exact admitted staging source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify old RC authority and remediate localhost-only access
        shell: bash
        run: bash scripts/uat/repair-loopback.sh
      - name: Record pending human UAT
        shell: bash
        run: |
          printf 'Private UAT loopback repair PASS; browser/human acceptance still pending.\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Open via SSH local tunnel to 127.0.0.1:18080 only. No main/pubic-edge promotion.\n' >> "$GITHUB_STEP_SUMMARY"
