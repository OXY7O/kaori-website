name: Release Candidate
run-name: "Release Candidate · ${{ inputs.candidate_tag || github.ref_name }}"
on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Intentional SemVer RC tag, for example v0.1.0-rc.1
        required: true
        type: string
permissions:
  contents: write
  actions: read
  id-token: write
concurrency:
  group: kaori-website-rc
  cancel-in-progress: false
jobs:
  publish:
    name: Publish Release Candidate
    runs-on: [self-hosted, linux, x64, platform-ci]
    environment:
      name: staging
      url: https://kaori.cloud
    timeout-minutes: 120
    env:
      REGISTRY_USER: ${{ secrets.KAORI_WEBSITE_DOCKER_REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.KAORI_WEBSITE_DOCKER_REGISTRY_PASSWORD }}
      ACCEPTED_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Resolve protected Environment configuration
        shell: bash
        env:
          KAORI_WEBSITE_DOCKER_REGISTRY_HOST: ${{ vars.KAORI_WEBSITE_DOCKER_REGISTRY_HOST }}
          KAORI_WEBSITE_DOCKER_REGISTRY_IMAGE: ${{ vars.KAORI_WEBSITE_DOCKER_REGISTRY_IMAGE }}
        run: bash scripts/release/resolve-environment.sh registry
      - name: Resolve exact admitted RC request
        id: candidate
        shell: bash
        env:
          REQUEST_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -Eeuo pipefail
          fail() { printf 'BLOCK: %s\n' "$*" >&2; exit 1; }
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          current="$(curl -fsS "${headers[@]}" "$api/git/ref/heads/kaori/staging" | jq -r '.object.sha')"
          [[ "$current" =~ ^[a-f0-9]{40}$ && "$GITHUB_SHA" == "$current" ]] || fail 'RC request differs from current staging SHA'
          [[ "$(git rev-parse HEAD)" == "$current" ]] || fail 'RC checkout differs from accepted staging'
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/kaori/staging ]] ||
            fail 'manual RC requires protected staging and staging Environment'
          tag="$REQUEST_TAG"
          [[ "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+-rc[.][1-9][0-9]*$ ]] ||
            fail 'invalid requested RC tag'
          # Only publish the next patch RC derived from the latest stable release.
          # The image is built once; a signed RC on this exact source is reused.
          stable="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname |
            grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' | head -n1 || true)"
          [[ -n "$stable" ]] || fail 'stable Website base tag absent; manual bootstrap required'
          IFS=. read -r major minor patch <<<"${stable#v}"
          version="${major}.${minor}.$((patch + 1))"
          [[ "${tag%-rc.*}" == "v$version" ]] ||
            fail "requested RC must target the next stable v$version"

          existing="$(git tag --points-at "$current" |
            grep -E '^v[0-9]+[.][0-9]+[.][0-9]+-rc[.][1-9][0-9]*$' || true)"
          if [[ -n "$existing" ]]; then
            [[ "$(printf '%s\n' "$existing" | wc -l)" -eq 1 ]] ||
              fail 'ambiguous signed RC tags for exact staging source'
            [[ "$existing" == "$tag" ]] ||
              fail "staging source already has signed candidate $existing; request the same tag"
            release="$(curl -fsS "${headers[@]}" "$api/releases/tags/$existing")" ||
              fail 'existing source RC has no published GitHub prerelease'
            [[ "$(jq -r '.prerelease' <<<"$release")" == true ]] ||
              fail 'existing source release is not a prerelease'
            [[ "$(jq -r '.target_commitish' <<<"$release")" == "$current" ]] ||
              fail 'existing RC release target differs from current staging source'
            body="$(jq -r '.body // ""' <<<"$release")"
            grep -Eq '^Immutable digest: sha256:[a-f0-9]{64}$' <<<"$body" ||
              fail 'existing RC has no immutable digest evidence'
            grep -Eq '^Deployment authority: [^[:space:]]+@sha256:[a-f0-9]{64}$' <<<"$body" ||
              fail 'existing RC has no digest-qualified deployment authority'
            [[ "$body" == *'Trivy security and signed SBOM/provenance: PASS'* ]] ||
              fail 'existing RC has no signed evidence'
            printf 'tag=%s\nshould_publish=false\n' "$existing" >> "$GITHUB_OUTPUT"
            printf 'PASS: signed RC %s already published; no duplicate\n' "$existing"
            exit 0
          fi

          highest=0
          while IFS= read -r used; do
            [[ -n "$used" ]] || continue
            count="${used##*.}"
            [[ "$count" =~ ^[1-9][0-9]*$ ]] || continue
            if (( 10#$count > highest )); then highest=$((10#$count)); fi
          done < <(git tag --list "v${version}-rc.*")
          expected="v${version}-rc.$((highest + 1))"
          [[ "$tag" == "$expected" ]] ||
            fail "requested RC must be next unused tag $expected"
          status="$(curl -sS -o /dev/null -w '%{http_code}' "${headers[@]}" "$api/git/ref/tags/$tag")" ||
            fail 'GitHub tag uniqueness lookup failed'
          [[ "$status" == 404 ]] || fail "RC tag $tag reserved or GitHub API unavailable (HTTP $status)"
          printf 'tag=%s\nshould_publish=true\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'PASS: %s bound to admitted staging SHA %s\n' "$tag" "$current"
      - name: Verify admitted source and registry configuration
        if: ${{ steps.candidate.outputs.should_publish == 'true' }}
        shell: bash
        env:
          RC_TAG: ${{ steps.candidate.outputs.tag }}
        run: bash scripts/release/publish-candidate.sh preflight
      - name: Build, scan, sign and publish immutable candidate
        if: ${{ steps.candidate.outputs.should_publish == 'true' }}
        shell: bash
        env:
          RC_TAG: ${{ steps.candidate.outputs.tag }}
        run: bash scripts/release/publish-candidate.sh publish
      - name: Logout of registry
        if: always()
        shell: bash
        run: |
          if [[ -n "$REGISTRY_HOST" ]]; then docker logout "$REGISTRY_HOST" || true; fi
