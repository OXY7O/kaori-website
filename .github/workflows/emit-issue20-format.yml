name: Format current KAORI Website docs for issue 20 (temporary)
on:
  push:
    branches: [kaori/chore-20-actions-surface-cleanup]
    paths: [.github/workflows/emit-issue20-format.yml]
permissions:
  contents: read
jobs:
  emit:
    name: Emit canonical Prettier output without a write token
    runs-on: [self-hosted, linux, x64, platform-ci]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Print formatted docs as safe Base64 for reviewed commit
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in docs/CI_CD.md docs/DELIVERY.md; do
            printf 'KAORI_DOC_START_%s\n' "$(basename "$file")"
            ./node_modules/.bin/prettier "$file" | base64 -w0
            printf '\nKAORI_DOC_END_%s\n' "$(basename "$file")"
          done
