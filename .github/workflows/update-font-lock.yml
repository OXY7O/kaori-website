name: Update font dependency lock (temporary)

on:
  push:
    branches: [kaori/story-3-editorial-homepage]
    paths:
      - package.json
      - .github/workflows/update-font-lock.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '22.23.2'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit exact lockfile
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): self-host Inter font assets #3'
            git push origin HEAD:kaori/story-3-editorial-homepage
          fi
