name: KAORI Website Temporary Prettier Diff #51

on:
  push:
    branches:
      - kaori/story-51-how-kaori-works
    paths:
      - .github/workflows/format-51-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect canonical Prettier differences
    runs-on: [self-hosted, linux, x64, platform-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Inspect formatter changes without pushing
        shell: bash
        run: |
          npm exec -- prettier --write src/components/HowKaoriWorks.astro src/styles/global.css
          git diff -- src/components/HowKaoriWorks.astro src/styles/global.css
