name: Format homepage source (temporary)

on:
  push:
    branches: [kaori/story-3-editorial-homepage]
    paths:
      - .github/workflows/home-format.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: [self-hosted, linux, x64, platform-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format website sources (exclude protected workflow files)
        run: |
          set -Eeuo pipefail
          ./node_modules/.bin/prettier --write src docs .devcontainer README.md package.json tsconfig.json astro.config.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- src docs .devcontainer README.md package.json tsconfig.json astro.config.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'style(web): normalize homepage source to KAORI format gate #3'
            git push origin HEAD:kaori/story-3-editorial-homepage
          fi
