name: Community Fork Check

on:
  pull_request:
    branches:
      - kaori/staging
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# Feedback only: never a trusted Developer Check or release/admission authority.
permissions:
  contents: read

concurrency:
  group: kaori-website-community-fork-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fork-validation:
    name: Untrusted Fork Validation
    # Never dispatch unreviewed fork code to an organization self-hosted runner.
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Exact Fork Head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Fork Identity and Whitespace
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags --depth=1 "https://github.com/$BASE_REPOSITORY.git" "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git diff --check "$BASE_SHA" "$EXPECTED_HEAD"

      - name: Set Up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: "22.23.2"

      # Fork content executes only on an ephemeral host; no shared dependency cache.
      - name: Install Locked Dependencies Without Lifecycle Scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check Website Formatting
        run: npm run check-format

      - name: Check Website Types
        run: npm run check

      - name: Build Website Static Output
        run: npm run build
