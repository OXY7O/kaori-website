name: Production Release
run-name: "Production Release · ${{ inputs.stable_tag }} · main@${{ github.sha }}"

# A protected main merge is source admission, NOT release authorization.
# Only an explicit maintainer-dispatched request can reach production.
on:
  workflow_dispatch:
    inputs:
      stable_tag:
        description: Exact stable SemVer to publish (vX.Y.Z); must match accepted RC
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  release-request:
    name: Validate Explicit Release Request
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'OXY7O/kaori-website' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      promotion_pr: ${{ steps.reviewed-notes.outputs.promotion_pr }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout exact main to load reviewed release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Node for reviewed release-note validation
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: "22.23.5"
      - name: Resolve reviewed release notes and promotion PR without mutation
        id: reviewed-notes
        shell: bash
        env:
          REQUESTED_STABLE_TAG: ${{ inputs.stable_tag }}
        run: |
          set -Eeuo pipefail
          pr="$(node scripts/release/release-notes.mjs promotion-pr "$REQUESTED_STABLE_TAG")"
          node scripts/release/release-notes.mjs verify "$REQUESTED_STABLE_TAG" "$pr"
          printf 'promotion_pr=%s\n' "$pr" >> "$GITHUB_OUTPUT"
      - name: Verify requested version, accepted promotion PR and admitted main SHA before asking for production approval
        shell: bash
        env:
          REQUESTED_STABLE_TAG: ${{ inputs.stable_tag }}
          REQUESTED_PROMOTION_PR: ${{ steps.reviewed-notes.outputs.promotion_pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          fail() { printf 'BLOCK: %s\n' "$*" >&2; exit 1; }
          [[ "$REQUESTED_STABLE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]] ||
            fail 'explicit stable release version must be vX.Y.Z'
          [[ "$REQUESTED_PROMOTION_PR" =~ ^[1-9][0-9]*$ ]] ||
            fail 'explicit promotion PR number required'
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ &&
             "$GITHUB_REF" == refs/heads/main ]] ||
            fail 'release must dispatch from exact protected main'
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          gh_get() {
            curl --fail-with-body -sS --retry 2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' "$1"
          }
          current="$(gh_get "$api/git/ref/heads/main" | jq -r '.object.sha')"
          [[ "$current" == "$GITHUB_SHA" ]] || fail 'main advanced since release dispatch'
          permission="$(gh_get "$api/collaborators/$GITHUB_ACTOR/permission" | jq -r '.permission')"
          case "$permission" in admin|maintain|write) ;; *)
            fail 'requester has no trusted release-dispatch permission' ;;
          esac
          pull="$(gh_get "$api/pulls/$REQUESTED_PROMOTION_PR")"
          jq -e '
            .merged_at != null and .base.ref == "main" and
            .head.ref == "kaori/staging" and
            .head.repo.full_name == "OXY7O/kaori-website" and
            (.merge_commit_sha | test("^[a-f0-9]{40}$"))
          ' <<<"$pull" >/dev/null || fail 'release request requires merged official promotion PR'
          body="$(jq -r '.body // ""' <<<"$pull")"
          [[ "$(grep -Ec '^Human UAT evidence: https://github[.]com/OXY7O/kaori-website/issues/[1-9][0-9]*#issuecomment-[1-9][0-9]*$' <<<"$body" || true)" -eq 1 ]] ||
            fail 'promotion PR must contain exactly one Human UAT evidence URL'
          admitted="$(gh_get "$api/actions/workflows/quality.yml/runs?branch=main&event=push&head_sha=$GITHUB_SHA&per_page=100")"
          jq -e --arg sha "$GITHUB_SHA" '
            any(.workflow_runs[];
              .head_sha == $sha and .event == "push" and
              .status == "completed" and .conclusion == "success")
          ' <<<"$admitted" >/dev/null ||
            fail 'exact main Full Admission SUCCESS is required before release approval'
          echo "PASS: explicit stable request $REQUESTED_STABLE_TAG from promotion PR #$REQUESTED_PROMOTION_PR"
          echo "PASS: current main $GITHUB_SHA passed mandatory Full Admission"

  stable-publication:
    name: Release Accepted Artifact to Production
    needs: release-request
    if: ${{ needs.release-request.result == 'success' }}
    runs-on: [self-hosted, linux, x64, platform-ci]
    environment:
      name: production
      url: https://kaori.cloud
    concurrency:
      group: kaori-website-release-deploy
      cancel-in-progress: false
    timeout-minutes: 80
    permissions:
      contents: write
      actions: read
      pull-requests: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_STABLE_TAG: ${{ inputs.stable_tag }}
      PRODUCTION_PROMOTION_PR: ${{ needs.release-request.outputs.promotion_pr }}
      REGISTRY_USER: ${{ secrets.KAORI_WEBSITE_DOCKER_REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.KAORI_WEBSITE_DOCKER_REGISTRY_PASSWORD }}
      WEBSITE_SSH_KEY: ${{ secrets.KAORI_WEBSITE_HOST_SSH_PRIVATE_KEY }}
      WEBSITE_SSH_PASSPHRASE: ${{ secrets.KAORI_WEBSITE_HOST_SSH_PASSPHRASE }}
      WEBSITE_KNOWN_HOSTS: ${{ secrets.KAORI_WEBSITE_HOST_KNOWN_HOSTS }}
    steps:
      - name: Checkout exact approved main with full promotion lineage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up pinned Node for reviewed release-note validation
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: "22.23.5"
      - name: Resolve protected Environment configuration
        shell: bash
        env:
          KAORI_WEBSITE_DOCKER_REGISTRY_HOST: ${{ vars.KAORI_WEBSITE_DOCKER_REGISTRY_HOST }}
          KAORI_WEBSITE_DOCKER_REGISTRY_IMAGE: ${{ vars.KAORI_WEBSITE_DOCKER_REGISTRY_IMAGE }}
          KAORI_WEBSITE_HOST: ${{ vars.KAORI_WEBSITE_HOST }}
          KAORI_WEBSITE_HOST_PORT: ${{ vars.KAORI_WEBSITE_HOST_PORT }}
          KAORI_WEBSITE_HOST_USER: ${{ vars.KAORI_WEBSITE_HOST_USER }}
          KAORI_WEBSITE_HOST_DEPLOY_ROOT: ${{ vars.KAORI_WEBSITE_HOST_DEPLOY_ROOT }}
          KAORI_WEBSITE_COMPOSE_PROJECT: ${{ vars.KAORI_WEBSITE_COMPOSE_PROJECT }}
          KAORI_WEBSITE_STATE_DIR: ${{ vars.KAORI_WEBSITE_STATE_DIR }}
          KAORI_WEBSITE_LOOPBACK_PORT: ${{ vars.KAORI_WEBSITE_LOOPBACK_PORT }}
          KAORI_WEBSITE_ATTACH_EXISTING_EDGE: ${{ vars.KAORI_WEBSITE_ATTACH_EXISTING_EDGE }}
        run: bash scripts/release/resolve-environment.sh deployment
      - name: Verify explicit stable request, independent Human UAT and signed RC
        shell: bash
        run: bash scripts/release/promote-stable.sh preflight
      - name: Reconcile authorized production target and publish stable release
        shell: bash
        run: bash scripts/release/promote-stable.sh publish
      - name: Record explicit production release acceptance
        shell: bash
        run: |
          printf 'Explicit stable release request: %s\n' "$PRODUCTION_STABLE_TAG" >>"$GITHUB_STEP_SUMMARY"
          printf 'Reviewed promotion PR: #%s\n' "$PRODUCTION_PROMOTION_PR" >>"$GITHUB_STEP_SUMMARY"
          printf 'Native protected production Environment approval: run %s\n' "$GITHUB_RUN_ID" >>"$GITHUB_STEP_SUMMARY"
          echo 'The immutable OCI build identity remains the signed Human-Accepted RC digest; stable GitHub Release is separately versioned.' >>"$GITHUB_STEP_SUMMARY"
