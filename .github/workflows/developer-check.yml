name: KAORI Website Developer Check

on:
  pull_request:
    branches:
      - kaori/staging
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-developer-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  developer-check:
    name: Developer Check
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Astro and TypeScript
        run: npm run check
      - name: Build static website
        run: npm run build
      - name: Verify generated website output
        run: |
          set -Eeuo pipefail
          test -s dist/index.html
          test -s dist/branding/kaori-logo.svg
          grep -q 'From infrastructure to' dist/index.html
