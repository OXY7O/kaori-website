name: Developer Check
run-name: "Developer Check · PR #${{ github.event.pull_request.number }} · ${{ github.event.pull_request.head.ref }}"

on:
  pull_request:
    branches:
      - kaori/staging
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

concurrency:
  group: kaori-website-developer-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  KAORI_WEBSITE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  route:
    name: Route Checks
    # Reject fork events before a self-hosted runner is allocated.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'kaori/') }}
    runs-on: [self-hosted, linux, x64, platform-ci]
    timeout-minutes: 5
    outputs:
      web: ${{ steps.route.outputs.web }}
      dependencies: ${{ steps.route.outputs.dependencies }}
      container: ${{ steps.route.outputs.container }}
      release-config: ${{ steps.route.outputs.release_config }}
    steps:
      - name: Validate issue-linked source branch
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          [[ "$HEAD_REPO" == "$GITHUB_REPOSITORY" ]] || { echo 'Cross-repo PRs are not admitted to the self-hosted runner.' >&2; exit 1; }
          [[ "$SOURCE_BRANCH" =~ ^kaori/(story|bug|task|spike|chore|tech-debt|hotfix)-[0-9]+-[a-z0-9-]+$ ]] || { echo 'Source branch must be issue-linked.' >&2; exit 1; }
      - name: Checkout exact work SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KAORI_WEBSITE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Route changed paths
        id: route
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          git diff --check "$BASE_SHA" "$KAORI_WEBSITE_SOURCE_SHA"
          git diff --name-only "$BASE_SHA" "$KAORI_WEBSITE_SOURCE_SHA" > changed-files.txt
          echo 'Changed paths:'
          cat changed-files.txt
          web=false
          dependencies=false
          container=false
          release_config=false
          while IFS= read -r path; do
            case "$path" in
              src/*|public/*|tests/*|astro.config.mjs|tsconfig.json|package.json|package-lock.json|Dockerfile|compose.*|.devcontainer/*|.github/workflows/*|scripts/*|deploy/server/*)
                web=true ;;
            esac
            case "$path" in package.json|package-lock.json) dependencies=true ;; esac
            case "$path" in Dockerfile|compose.*|deploy/server/*|scripts/container_smoke.sh) container=true ;; esac
            case "$path" in scripts/release/*|.github/workflows/publish-staging-image.yml|.github/workflows/deploy-staging-host.yml) release_config=true ;; esac
          done < changed-files.txt
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "dependencies=$dependencies" >> "$GITHUB_OUTPUT"
          echo "container=$container" >> "$GITHUB_OUTPUT"
          echo "release_config=$release_config" >> "$GITHUB_OUTPUT"
  targeted:
    name: Website Validation
    needs: route
    runs-on: [self-hosted, linux, x64, platform-ci]
    timeout-minutes: 20
    steps:
      - name: Confirm path-aware profile
        shell: bash
        env:
          NEED_WEB: ${{ needs.route.outputs.web }}
        run: |
          set -Eeuo pipefail
          printf 'Website source changed: %s\n' "$NEED_WEB"
      - name: Checkout exact work SHA
        if: ${{ needs.route.outputs.web == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KAORI_WEBSITE_SOURCE_SHA }}
          persist-credentials: false
      - name: Set up Node
        if: ${{ needs.route.outputs.web == 'true' }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Install locked dependencies
        if: ${{ needs.route.outputs.web == 'true' }}
        run: npm ci --no-audit --no-fund
      - name: Audit changes to dependency authority
        if: ${{ needs.route.outputs.dependencies == 'true' }}
        run: npm audit --audit-level=high
      - name: Validate website formatting
        if: ${{ needs.route.outputs.web == 'true' }}
        run: npm run check-format
      - name: Validate committed shell script syntax
        if: ${{ needs.route.outputs.web == 'true' }}
        run: |
          set -Eeuo pipefail
          while IFS= read -r path; do
            bash -n "$path"
          done < <(git ls-files '*.sh')
      - name: Validate Astro and TypeScript
        if: ${{ needs.route.outputs.web == 'true' }}
        run: npm run check
      - name: Build website
        if: ${{ needs.route.outputs.web == 'true' }}
        run: npm run build
      - name: Verify website artifact
        if: ${{ needs.route.outputs.web == 'true' }}
        run: |
          set -Eeuo pipefail
          test -s dist/index.html
          test -s dist/branding/kaori-logo.svg
          grep -qi 'kaori' dist/index.html

  container-smoke:
    name: Container Validation
    needs: route
    if: ${{ needs.route.outputs.container == 'true' }}
    runs-on: [self-hosted, linux, x64, platform-ci]
    timeout-minutes: 25
    steps:
      - name: Checkout exact work SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KAORI_WEBSITE_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify container runtime and script syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deploy/server/deploy.sh deploy/server/rollback.sh deploy/server/verify.sh scripts/container_smoke.sh
          bash scripts/container_smoke.sh "$KAORI_WEBSITE_SOURCE_SHA"

  release-registry-preflight:
    name: Release Configuration
    needs: route
    if: ${{ needs.route.outputs.release-config == 'true' }}
    runs-on: [self-hosted, linux, x64, platform-ci]
    timeout-minutes: 5
    env:
      REGISTRY_HOST: ${{ vars.KAORI_WEBSITE_DOCKER_REGISTRY_HOST }}
      REGISTRY_IMAGE: ${{ vars.KAORI_WEBSITE_DOCKER_REGISTRY_IMAGE }}
    steps:
      - name: Verify independent KAORI Website image repository
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$REGISTRY_HOST" && -n "$REGISTRY_IMAGE" ]] || { echo 'BLOCK: registry repository Variables missing' >&2; exit 1; }
          [[ "$REGISTRY_HOST" != *://* && "$REGISTRY_HOST" != *' '* ]] || { echo 'BLOCK: registry host invalid' >&2; exit 1; }
          [[ "$REGISTRY_IMAGE" == "$REGISTRY_HOST/"* && "$REGISTRY_IMAGE" == */kaori-website ]] || { echo 'BLOCK: image namespace must be dedicated to KAORI Website, ending /kaori-website' >&2; exit 1; }
          [[ "$REGISTRY_IMAGE" != *' '* && "$REGISTRY_IMAGE" != *':'* ]] || { echo 'BLOCK: registry image must not be mutable tag or malformed' >&2; exit 1; }
          printf 'PASS: website registry Variables identify an independent /kaori-website repository. Values withheld.\n'
