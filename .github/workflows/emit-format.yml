name: Emit canonical deployment document (temporary)

on:
  push:
    branches: [kaori/task-5-static-docker-adapter]
    paths:
      - .github/workflows/emit-format.yml

permissions:
  contents: read

jobs:
  emit:
    runs-on: [self-hosted, linux, x64, platform-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Show authoritative Prettier formatted deployment documentation
        run: |
          set -Eeuo pipefail
          printf 'KAORI_DEPLOY_DOC_BEGIN\n'
          ./node_modules/.bin/prettier docs/DEPLOYMENT.md | base64 -w0
          printf '\nKAORI_DEPLOY_DOC_END\n'
