name: Full Admission
run-name: "Full Admission · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }} · ${{ github.sha }}"

on:
  push:
    branches:
      - kaori/staging
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: kaori-website-admission-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  KAORI_WEBSITE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  promotion-source:
    name: Promotion Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify promotion source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            [[ "$BASE_REF" == main && "$HEAD_REPO" == "$GITHUB_REPOSITORY" && "$HEAD_REF" == 'kaori/staging' ]] || {
              echo 'Only kaori/staging may open a promotion PR to main.' >&2
              exit 1
            }
          fi
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$GITHUB_REF" == refs/heads/kaori/staging || "$GITHUB_REF" == refs/heads/main ]] || {
              echo 'Manual admission is limited to governed long-lived branches.' >&2
              exit 1
            }
          fi
  full-admission:
    name: Full Admission
    needs: promotion-source
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Recover runner-owned workspace after isolated browser test
        if: ${{ runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # Bound ownership repair to this job's checkout workspace, never runner directories.
          uid="$(id -u)"
          gid="$(id -g)"
          [[ -n "$GITHUB_WORKSPACE" && -d "$GITHUB_WORKSPACE" ]] || exit 1
          docker run --rm --network=none --user 0 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace" \
            --entrypoint /usr/bin/chown mcr.microsoft.com/playwright:v1.56.1-noble \
            -R "$uid:$gid" /workspace
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KAORI_WEBSITE_SOURCE_SHA }}
          persist-credentials: false
      - name: Capture source and tree identities
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$KAORI_WEBSITE_SOURCE_SHA"
          printf 'Source SHA: %s\nTree SHA: %s\n' "$(git rev-parse HEAD)" "$(git show -s --format=%T HEAD)"
      - name: Set up pinned Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Restore locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify release and runner safety contracts
        run: node --test tests/contracts/release/*.test.mjs
      - name: Validate committed shell script syntax
        run: |
          set -Eeuo pipefail
          while IFS= read -r path; do
            bash -n "$path"
          done < <(git ls-files '*.sh')
      - name: Format and style gate
        run: npm run check-format
      - name: Validate Astro and TypeScript
        run: npm run check
      - name: High-severity dependency gate
        run: npm audit --audit-level=high
      - name: Production build
        run: npm run build
      - name: Verify website artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s dist/index.html
          test -s dist/branding/kaori-logo.svg
          test -s dist/licenses/inter/OFL-1.1.txt
          cmp node_modules/@fontsource-variable/inter/LICENSE dist/licenses/inter/OFL-1.1.txt
          test -s dist/licenses/lucide/LICENSE.txt
          grep -Fq 'ISC License' dist/licenses/lucide/LICENSE.txt
          grep -Fq 'The MIT License (MIT) (for the icons listed above)' dist/licenses/lucide/LICENSE.txt
          grep -Fq 'Copyright (c) 2013-present Cole Bemis' dist/licenses/lucide/LICENSE.txt
          grep -qi 'kaori' dist/index.html
          ! grep -REn 'https://(cdn\.jsdelivr\.net|fonts\.googleapis\.com|unpkg\.com)' dist/ || { echo 'Unexpected public CDN dependency' >&2; exit 1; }
      - name: Record admission evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'Full website admission source: %s\n' "$KAORI_WEBSITE_SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'Output: statically built website (deployment, browser verification, and human acceptance require separate evidence)\n' >> "$GITHUB_STEP_SUMMARY"

  container-admission:
    name: Container Admission
    needs: full-admission
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact admitted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KAORI_WEBSITE_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify container runtime without deployment
        shell: bash
        run: bash scripts/container_smoke.sh "$KAORI_WEBSITE_SOURCE_SHA"

  browser-evidence:
    name: Browser Quality Evidence
    needs: [promotion-source, full-admission]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host
    permissions:
      contents: read
    steps:
      - name: Checkout exact admitted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KAORI_WEBSITE_SOURCE_SHA }}
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Restore locked browser dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify pinned Playwright browser version
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(npx playwright --version)" = "Version 1.56.1"
      - name: Build exact browser candidate
        run: npm run build
      - name: Run browser interaction, accessibility and visual evidence tests
        run: npm run test:browser
      - name: Attach immutable job evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-browser-evidence-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30
          if-no-files-found: warn
      - name: Restore host runner ownership of browser workspace
        if: ${{ always() && runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # GitHub runner's mounted temp directory is owned by the actual host runner UID.
          owner="$(stat -c '%u:%g' "$RUNNER_TEMP")"
          [[ "$owner" =~ ^[0-9]+:[0-9]+$ ]] || exit 1
          chown -R "$owner" "$GITHUB_WORKSPACE"

  stable-publication:
    name: Publish Human Accepted Stable Release
    needs: [promotion-source, full-admission, container-admission, browser-evidence]
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.KAORI_WEBSITE_AUTO_PRODUCTION_ENABLED == 'true' }}
    runs-on: [self-hosted, linux, x64, platform-ci]
    environment:
      name: production
      url: https://kaori.cloud
    # Same physical slot as signed staging RC, so no overlapping mutation.
    concurrency:
      group: kaori-website-release-deploy
      cancel-in-progress: false
    timeout-minutes: 80
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REGISTRY_HOST: ${{ vars.KAORI_WEBSITE_DOCKER_REGISTRY_HOST }}
      REGISTRY_IMAGE: ${{ vars.KAORI_WEBSITE_DOCKER_REGISTRY_IMAGE }}
      REGISTRY_USER: ${{ secrets.KAORI_WEBSITE_DOCKER_REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.KAORI_WEBSITE_DOCKER_REGISTRY_PASSWORD }}
      WEBSITE_HOST: ${{ vars.KAORI_WEBSITE_HOST }}
      WEBSITE_SSH_PORT: ${{ vars.KAORI_WEBSITE_HOST_PORT }}
      WEBSITE_SSH_USER: ${{ vars.KAORI_WEBSITE_HOST_USER }}
      WEBSITE_DEPLOY_ROOT: ${{ vars.KAORI_WEBSITE_HOST_DEPLOY_ROOT }}
      WEBSITE_SSH_KEY: ${{ secrets.KAORI_WEBSITE_HOST_SSH_PRIVATE_KEY }}
      WEBSITE_SSH_PASSPHRASE: ${{ secrets.KAORI_WEBSITE_HOST_SSH_PASSPHRASE }}
      WEBSITE_KNOWN_HOSTS: ${{ secrets.KAORI_WEBSITE_HOST_KNOWN_HOSTS }}
    steps:
      - name: Checkout exact approved main with full promotion lineage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify exact promotion, independent Human UAT and signed RC
        shell: bash
        run: bash scripts/release/promote-stable.sh preflight
      - name: Reverify accepted OCI digest and running public slot, publish stable without rebuild
        shell: bash
        run: bash scripts/release/promote-stable.sh publish
      - name: Record production Environment acceptance boundary
        shell: bash
        run: |
          printf 'Approved production Environment run: %s\n' "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          printf 'Same public Website slot; no image rebuild or automatic host mutation\n' >> "$GITHUB_STEP_SUMMARY"
