name: Temporary Prettier Diff #60

on:
  push:
    branches:
      - kaori/bug-60-journey-copy-quote
    paths:
      - .github/workflows/format-60-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect canonical Astro Prettier diff
    runs-on: [self-hosted, linux, x64, platform-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout exact work source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Inspect Prettier diff without writing to remote branch
        shell: bash
        run: |
          npm exec -- prettier --write src/components/HowKaoriWorks.astro
          git diff -- src/components/HowKaoriWorks.astro
